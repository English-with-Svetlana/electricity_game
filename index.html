<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070b">
  <title>BLACKOUT — Grammar Survival Mission</title>
  <link rel="stylesheet" href="style.css?v=602f248308e7105a25ca">
</head>
<body>
  <main id="viewport" aria-label="BLACKOUT educational survival game">
    <section id="game" class="game-shell">
      <div id="loading" class="loading-screen" aria-live="polite">
        <h1>BLACKOUT</h1><p>LOADING...</p>
        <div class="load-track"><span id="load-bar"></span></div><output id="load-value">0%</output>
      </div>

      <section id="screen" class="screen" aria-live="polite"></section>

      <header id="hud" class="hud hidden" aria-label="Mission status">
        <img data-src="assets/optimized/lossless/ui/hud_panel.webp?v=b36af6e707647b0df650" alt="" draggable="false">
        <div id="hud-lives" class="hud-lives" aria-label="Lives"></div>
        <div class="energy-bar"><span id="energy-fill"></span></div>
        <output id="hud-energy" class="sr-only">100 energy</output>
        <output id="hud-score" class="hud-score">0</output>
        <output id="hud-time" class="hud-time">00:00</output>
        <output id="hud-secrets" class="hud-secrets">0/5</output>
        <button id="backpack" class="hotspot backpack" type="button" title="Backpack" aria-label="Backpack" aria-expanded="false"><span class="backpack-content"><span class="backpack-icon" aria-hidden="true"></span><span id="backpack-count" class="backpack-count">0/4</span></span></button>
      </header>

      <div id="feedback" class="feedback" role="status" aria-live="assertive"></div>
      <button id="audio-toggle" class="audio-toggle" type="button" aria-label="Audio settings" aria-expanded="false">🔊</button>
      <div id="modal-root"></div>
    </section>
  </main>
  <script src="release-assets.js?v=6a86a389e5cb0c09776d"></script>
  <script src="script.js?v=dc1220bc27e85cf99b8c"></script>
</body>
</html>
