<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070b">
  <title>BLACKOUT — Grammar Survival Mission</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    #embed-viewport{position:fixed;inset:0;overflow:hidden;background:#000}
    /* The child document owns every game coordinate; only this wrapper scales. */
    #stage-fit{position:absolute;left:50%;top:50%;width:1536px;height:864px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--stage-scale,0))}
    #game-frame{display:block;width:100%;height:100%;border:0;background:#000}
  </style>
</head>
<body>
  <main id="embed-viewport" aria-label="BLACKOUT educational survival game">
    <div id="stage-fit">
      <iframe id="game-frame" src="game.html?v=bbaf3611cfba29860d0d" width="1536" height="864" title="BLACKOUT game" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </main>
  <script>
    // These dimensions match the optimized 16:9 backgrounds. The original game
    // itself had a responsive shell, not an explicit fixed native pixel size.
    const frame=document.querySelector('#game-frame');
    const wrapper=document.querySelector('#stage-fit');
    const viewport=document.querySelector('#embed-viewport');
    const stageWidth=Number(frame.getAttribute('width'));
    const stageHeight=Number(frame.getAttribute('height'));
    // Forward existing local review links without changing their game behavior.
    const target=new URL(frame.getAttribute('src'),document.baseURI);
    for(const [name,value] of new URLSearchParams(location.search)){
      if(name!=='v')target.searchParams.append(name,value);
    }
    target.hash=location.hash;
    if(location.search||location.hash)frame.src=target.href;
    function fitStage(){
      const scale=Math.min(viewport.clientWidth/stageWidth,viewport.clientHeight/stageHeight);
      wrapper.style.setProperty('--stage-scale',String(Math.max(0,scale)));
    }
    fitStage();
    window.addEventListener('resize',fitStage);
    if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitStage).observe(viewport);
    window.visualViewport?.addEventListener('resize',fitStage);
  </script>
</body>
</html>
